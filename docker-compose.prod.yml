# HermesX 生产环境 Docker Compose
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hermesx-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-hermesx}
      POSTGRES_USER: ${DB_USER:-hermesx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hermesx_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - hermesx-net

  redis:
    image: redis:7-alpine
    container_name: hermesx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - hermesx-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hermesx-backend
    environment:
      DATABASE_URL: postgresql://${DB_USER:-hermesx}:${DB_PASSWORD:-hermesx_dev_2026}@postgres:5432/${DB_NAME:-hermesx}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-hermesx_jwt_secret_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-hermesx_encryption_key_32bytes_change_me!!}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_TESTNET_API_KEY: ${BINANCE_TESTNET_API_KEY:-}
      BINANCE_TESTNET_API_SECRET: ${BINANCE_TESTNET_API_SECRET:-}
      DEFAULT_ENVIRONMENT: ${DEFAULT_ENVIRONMENT:-TESTNET}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - hermesx-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hermesx-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hermesx-net

volumes:
  postgres_data:
  redis_data:

networks:
  hermesx-net:
    driver: bridge
