version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hermesx-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-hermesx}
      POSTGRES_USER: ${DB_USER:-hermesx}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hermesx_dev_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hermesx-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
